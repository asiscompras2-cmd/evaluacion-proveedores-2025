<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evaluación de Proveedores 2026</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="container my-4">

<div class="card shadow-lg">

<!-- HEADER -->
<div class="card-header text-center">
    <h2>EVALUACIÓN DE PROVEEDORES 2025</h2>
    <h5>PARQUE COMERCIAL EL TESORO</h5>
</div>

<div class="card-body">

<!-- 🔥 SOLO UNA VISTA (sin historial visible) -->

<!-- DATOS -->
<h4 class="titulo">Datos del Evaluador</h4>

<div class="row">
    <div class="col-md-6 mb-3">
        <label>Nombre Completo</label>
        <input type="text" class="form-control" id="nombre">
    </div>

    <div class="col-md-3 mb-3">
        <label>Cédula</label>
        <input type="text" class="form-control" id="cedula">
    </div>

    <div class="col-md-3 mb-3">
        <label>Fecha</label>
        <input type="date" class="form-control" id="fecha" readonly>
    </div>
</div>

<hr>

<!-- PROVEEDOR -->
<h4 class="titulo">Proveedor</h4>

<div class="row">
    <div class="col-md-6 mb-3">
        <label>Área</label>
        <select id="area" class="form-select"></select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Proveedor</label>
        <select id="proveedor" class="form-select"></select>
    </div>
</div>

<div class="row">
    <div class="col-md-4 mb-3">
        <label>NIT</label>
        <input type="text" id="nit" class="form-control" readonly>
    </div>

    <div class="col-md-8 mb-3">
        <label>Servicio</label>
        <input type="text" id="servicio" class="form-control" readonly>
    </div>
</div>

<hr>

<!-- EVALUACION -->
<h4 class="titulo">Evaluación del Proveedor</h4>

<div class="escala-evaluacion">
    <strong>Escala:</strong>
    1 Inaceptable | 2 Deficiente | 3 Aceptable | 4 Bueno | 5 Excelente
</div>

<!-- 🔥 CONTENEDOR VISUAL -->
<div class="card shadow-sm p-3 mt-3">
    <div id="contenedorPreguntas"></div>
</div>

<hr>

<!-- OBSERVACIONES -->
<h4 class="titulo">Observaciones</h4>
<textarea id="observaciones" class="form-control" rows="4"></textarea>

<br>

<!-- RESULTADO -->
<div id="resultado" class="text-center">
    <div class="alert alert-light border">
        <h4 class="text-muted">RESULTADO</h4>
        <p>Responda todas las preguntas</p>
    </div>
</div>

<!-- BOTON -->
<div class="text-center mt-4">
    <button id="btnGuardar" class="btn btn-success btn-lg w-100">
        GUARDAR EVALUACIÓN
    </button>
</div>

</div>
</div>
</div>

<!-- LIBRERIAS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="proveedores.js"></script>
<script src="preguntas.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="calculos.js"></script>

</body>
</html>
